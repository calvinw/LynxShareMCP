[project]
name = "lynx-share-mcp"
version = "0.1.0"
description = "MCP server for LYNX SHARE: drives the app through its Remote Control API."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lynx-share-mcp = "lynx_share_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lynx_share_mcp"]
